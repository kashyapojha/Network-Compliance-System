#
# FreeRADIUS Clients Configuration
# Define network devices that can authenticate against this server
#

client localhost {
    ipaddr = 127.0.0.1
    secret = testing123
    shortname = localhost
}

client wireless_network {
    ipaddr = 192.168.1.0/24
    secret = wireless_secret
    shortname = wireless
    nas_type = other
}

client switch_network {
    ipaddr = 192.168.2.0/24
    secret = switch_secret
    shortname = switches
    nas_type = cisco
}

client vpn_gateway {
    ipaddr = 10.0.0.0/24
    secret = vpn_secret
    shortname = vpn
    nas_type = other
}
