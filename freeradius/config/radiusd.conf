#
# FreeRADIUS Configuration for Certificate-Based Network Access Control
# EAP-TLS Authentication with Custom CA Validation
#

prefix = /usr
exec_prefix = ${prefix}

syslog_facility = daemon

log {
    destination = syslog
    syslog_facility = daemon
    stripped_names = no
    auth = no
    auth_badpass = no
    auth_goodpass = no
    msg_badpass = "Password incorrect"
    msg_goodpass = "Password correct"
}

# Security settings
security {
    max_attributes = 200
    reject_delay = 1
    status_server = no
}

# Database configuration
modules {
    # PostgreSQL for certificate validation
    sql {
        driver = "rlm_sql_postgresql"
        server = "localhost"
        port = 5432
        login = "postgres"
        password = "postgres"
        radius_db = "network_compliance"
        
        # SQL queries for certificate validation
        authorize_check_query = "SELECT id, username, value FROM radcheck WHERE username = '%{SQL-User-Name}' ORDER BY id"
        authorize_reply_query = "SELECT id, attribute, op, value FROM radreply WHERE username = '%{SQL-User-Name}' ORDER BY id"
        
        # Certificate validation query
        authenticate_query = "SELECT id, username FROM certificates WHERE serial_number = '%{TLS-Client-Cert-Serial}' AND is_revoked = 0"
        
        simul_count_query = "SELECT COUNT(*) FROM radacct WHERE username = '%{SQL-User-Name}' AND acctstoptime IS NULL"
        simul_verify_query = "SELECT COUNT(*) FROM radacct WHERE username = '%{SQL-User-Name}' AND acctstoptime IS NULL AND (acctstarttime > NOW() - '%S' OR acctstoptime > NOW() - '%S')"
    }
    
    # EAP-TLS configuration
    eap {
        default_eap_type = tls
        timer_expire = 60
        ignore_unknown_eap_types = no
        cisco_accounting_username_bug = no
        max_sessions = 4096
        
        tls {
            tls_config = ${confdir}/tls-config
        }
    }
    
    # Certificate validation
    exec {
        wait = yes
        program = "/usr/local/bin/validate_cert.py %{TLS-Client-Cert-Serial}"
        input_pairs = request
        output_pairs = reply
    }
}

# Authorization
authorize {
    # First check SQL for certificate validity
    sql
    
    # Then check EAP
    eap
    
    # If no certificate found, reject
    if (!EAP-Message) {
        reject
    }
}

# Authentication
authenticate {
    eap
}

# Accounting
accounting {
    sql
    exec
}

# Session management
session {
    sql
}

# Post-authentication
post-auth {
    sql
    exec
}

# Pre-proxy
pre-proxy {
}

# Post-proxy
post-proxy {
}
