# Run from repository root so variables interpolate from the same .env as the app:
#   docker compose --env-file .env -f docker/docker-compose.yml up -d
#
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: network-compliance-db
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - network-compliance
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: network-compliance-backend
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      PORT: 5000
      CORS_ORIGINS: ${CORS_ORIGINS}
      SOCKETIO_CORS_ORIGINS: ${SOCKETIO_CORS_ORIGINS}
      CERTIFICATES_DIR: /app/certificates
    ports:
      - "5000:5000"
    volumes:
      - ../backend:/app
      - ../certificates:/app/certificates
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - network-compliance
    command: python main.py

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: network-compliance-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - network-compliance

  freeradius:
    image: freeradius/freeradius-server:3.2-alpine
    container_name: network-compliance-freeradius
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    volumes:
      - ../freeradius/config:/etc/raddb
      - ../certificates:/etc/raddb/certs
    depends_on:
      - postgres
    networks:
      - network-compliance
    command: freeradius -f -X

  monitoring:
    build:
      context: ../monitoring
      dockerfile: ../docker/Dockerfile.monitoring
    container_name: network-compliance-monitoring
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NETWORK_RANGE: ${NETWORK_RANGE}
      POLL_INTERVAL: ${POLL_INTERVAL}
      BACKEND_URL: ${BACKEND_URL:-http://backend:5000}
    volumes:
      - ../monitoring:/app
      - ../monitoring/logs:/app/logs
    network_mode: host
    depends_on:
      - postgres
      - backend
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW

volumes:
  postgres_data:

networks:
  network-compliance:
    driver: bridge
